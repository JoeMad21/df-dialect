# lit configuration for DF-Dialect FileCheck tests.
# Run all tests:   uv run lit -v tests/filecheck
# Run one test:    uv run lit -v tests/filecheck/dialect/matmul.mlir
import os

import lit.formats

config.name = "df-dialect"
# Internal shell: works the same on Linux, macOS and Windows.
config.test_format = lit.formats.ShTest(execute_external=False)
config.suffixes = [".mlir"]
config.test_source_root = os.path.dirname(__file__)
config.excludes = ["lit.cfg"]
