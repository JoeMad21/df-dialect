[project]
name = "df-dialect"
version = "0.1.0"
description = "DF-Dialect: an MLIR dataflow dialect for spatial accelerators, built on xDSL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "xdsl==0.71.0",
]

[project.scripts]
df-opt = "xdsl.tools.xdsl_opt:main"

[project.entry-points."xdsl.universe"]
df_dialect = "df_dialect.universe:DF_UNIVERSE"

[dependency-groups]
dev = [
    "filecheck>=1.0.6",
    "lit>=18.1.8",
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/df_dialect"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format handles line length; long messages are fine

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.pyright]
include = ["src", "tests/unit"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
