name: Task
description: A unit of work with clear acceptance criteria
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, testable statements. "df-opt X prints Y", "error Z is reported".
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Difficulty
      options: ["good first issue", "intermediate", "advanced"]
